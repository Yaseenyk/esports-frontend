name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Scheduled guides (src/content/scheduled) carry a release date and stay hidden until it. A daily rebuild at 00:17 UTC turns
  # on the one that is due: Monday, Wednesday and Friday. Off the top of the hour, when GitHub delays scheduled runs. A dropped
  # run is caught up the next day, because the build shows every guide whose date has passed.
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://esports.streamerosai.com
          NEXT_PUBLIC_API_URL: https://esports-api.yaseenyk.workers.dev

      - name: Check third-party scripts in the built site (allowlist, no payment SDKs)
        run: npm run check:third-party

      - name: Check the built site as a search engine would (titles, links, noindex, sitemap)
        run: node scripts/verify-seo.mjs

      - name: Disable Jekyll
        run: touch ./out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 420000
        continue-on-error: true
      # GitHub's Pages backend sometimes accepts a deployment and never finishes it. Retry once, after the first
      # attempt has fully aborted, instead of waiting for someone to re-run the job by hand.
      - name: Wait for the first attempt to finish aborting
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - name: Retry the deployment once
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 420000

  # GitHub switches off scheduled workflows in a public repository after 60 days without activity. If nothing has been
  # committed for 45 days, a scheduled run records an empty commit so the guide schedule keeps running.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Commit if the repository has been quiet for 45 days
        run: |
          last=$(git log -1 --format=%ct)
          age=$(( ($(date +%s) - last) / 86400 ))
          echo "Last commit was $age days ago."
          if [ "$age" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the guide schedule active"
            git push
          fi

  # Tell Bing and other IndexNow engines about pages that changed in this commit, or went live today by schedule (Google does not use IndexNow).
  # (the scheduled guides have no commit of their own on release day, so the script also reads today's date from the live sitemap)
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with the parent commit for the diff)
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Submit changed pages
        run: node scripts/indexnow.mjs
        continue-on-error: true
